name: Sarkari Naukri Job Checker

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram connection test instead of scanning jobs"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

# Prevent overlapping scheduled/manual runs from racing to push job data.
concurrency:
  group: sarkari-naukri-job-checker
  cancel-in-progress: false

jobs:
  check-jobs:
    timeout-minutes: 25
    runs-on: ubuntu-24.04

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Test Telegram connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        run: |
          python telegram_test.py

      - name: Run job checker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        run: |
          python job_checker.py

      - name: Save job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update job data"

          # The source checker can take several minutes. Another run or a
          # manual code change may push to main while this run is processing.
          # Rebase onto the latest main before pushing so a harmless race does
          # not turn an otherwise successful job check red.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Job data pushed successfully."
              exit 0
            fi

            echo "Push failed because main changed. Fetching latest main and rebasing (attempt $attempt/3)..."
            git fetch origin main
            git rebase origin/main
          done

          echo "ERROR: Could not push job data after 3 attempts."
          exit 1
