name: Sarkari Naukri Job Checker

on:
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Send a Telegram connection test instead of scanning jobs"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 */2 * * *"

permissions:
  contents: write

jobs:
  check-jobs:
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Test Telegram connection
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram == true }}
        run: |
          python telegram_test.py

      - name: Run job checker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_telegram != true }}
        run: |
          python job_checker.py

      - name: Save job data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to save."
          else
            git commit -m "Update job data"
            git push
          fi
