name: Sarkari Naukri Job Checker

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */2 * * *"

jobs:
  check-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test automation
        run: |
          python --version
          echo "Sarkari Naukri checker is running!"
